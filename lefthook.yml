extends:
  - node_modules/@arnaud-zg/configs/lefthook/lefthook.yml

# The docs are checked by the repo's own doc-compass skill whenever a page changes, because CI only
# runs by hand: a check that only CI runs never fails.
pre-commit:
  commands:
    docs:
      glob: "{docs,plugins/*/docs}/**/*.md"
      run: pnpm lint:docs
    # Each skill with ports/ carries a copy of hexagonal-architecture's contract. Staging the source,
    # a copy or a ports page rewrites the copies from the source and stages them.
    contract:
      glob: "plugins/*/skills/*/{domain/contract.md,ports/*.md}"
      run: node scripts/sync-contract.mjs && git add plugins/*/skills/*/ports/CONTRACT.md
